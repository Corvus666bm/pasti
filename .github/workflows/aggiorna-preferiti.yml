# Ogni domenica, prima che Claude prepari il menù, copia nel repository
# l'elenco dei piatti segnati col cuore nell'app (preferiti.json).
name: Aggiorna preferiti
on:
  schedule:
    - cron: "7 15 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  esporta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leggi i preferiti dal database
        run: |
          curl -fsS -X POST "https://vstkcwuroupmydglzybw.supabase.co/rest/v1/rpc/elenco_preferiti" \
            -H "apikey: sb_publishable__GqAHtVB-KW50CP0_VSV1Q_e-2_lCjV" \
            -H "Content-Type: application/json" -d '{}' > /tmp/p.json
          python3 - <<'PY'
          import json, datetime
          ids = json.load(open('/tmp/p.json'))
          ids = sorted({x if isinstance(x, str) else list(x.values())[0] for x in ids})
          json.dump({"aggiornato": datetime.date.today().isoformat(), "preferiti": ids},
                    open('preferiti.json', 'w'), ensure_ascii=False, indent=1)
          PY
      - name: Salva se è cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preferiti.json
          git diff --cached --quiet || git commit -m "Aggiorna preferiti" && git push
